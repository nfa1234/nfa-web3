<!DOCTYPE html>
<html>
<head>

<title>Live</title>

<style>

body{
background:black;
color:white;
text-align:center;
font-family:Poppins;
}

</style>

</head>

<body>

<h1>Live Time</h1>

<div id="clock"></div>

<script>

setInterval(()=>{
document.getElementById("clock").innerHTML =
new Date().toLocaleTimeString();
},1000)

</script>

</body>
</html>
